<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DINX — offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #f6f3fb;
        color: #17161c;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .badge {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.25rem;
        display: grid;
        place-items: center;
        border-radius: 1.4rem;
        background: linear-gradient(135deg, #4a3364, #2c1e3e);
        color: #fff;
        font-size: 1.75rem;
        font-weight: 900;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #565364;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      button {
        border: 0;
        border-radius: 1rem;
        padding: 0.85rem 1.75rem;
        background: #6d3fa8;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">D</div>
      <h1>You're offline</h1>
      <p>DINX needs a connection to load your household's numbers.<br />Anything you logged already is safely saved.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
